<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Favicon Changer</title>
    <style>
      body {
        width: 280px;
        font-family: -apple-system, Segoe UI, Arial, sans-serif;
        font-size: 13px;
        padding: 12px;
        margin: 0;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .site {
        font-size: 12px;
        color: #555;
        word-break: break-all;
        margin-bottom: 12px;
      }
      .preview {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .preview img {
        width: 24px;
        height: 24px;
        border: 1px solid #ccc;
        border-radius: 4px;
        object-fit: contain;
        background: #fff;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin-bottom: 12px;
      }
      .presets button {
        font-size: 16px;
        padding: 4px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f7f7f7;
        cursor: pointer;
      }
      .presets button:hover {
        background: #eee;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="file"] {
        width: 100%;
        box-sizing: border-box;
        padding: 4px;
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button.main {
        flex: 1;
        padding: 6px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      #apply {
        background: #2563eb;
        color: white;
      }
      #reset {
        background: #eee;
        color: #333;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #16a34a;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Favicon Changer</h1>
    <div class="site" id="site">Loading current site&hellip;</div>

    <div class="preview">
      <img id="previewImg" alt="preview" />
      <span id="previewLabel">No custom favicon selected</span>
    </div>

    <label>Emoji presets</label>
    <div class="presets" id="presets"></div>

    <label for="urlInput">Image URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com/icon.png" />

    <label for="fileInput">Or upload an image</label>
    <input type="file" id="fileInput" accept="image/*" />

    <div class="actions">
      <button class="main" id="apply">Apply to this site</button>
      <button class="main" id="reset">Reset</button>
    </div>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
